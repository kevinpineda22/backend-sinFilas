# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Node + TypeScript (CommonJS), Express 5, Supabase, Zod 4, JWT (jsonwebtoken), helmet, cors, morgan.
  Architecture: Modular por feature — src/modules/{catalog,sessions,admin} con route + controller + schemas + utils; src/shared/{db,middleware,audit}; src/config/env.ts.
  Testing: Vitest 4 (globals, environment node, tests/**/*.test.ts, setupFiles tests/setup.ts); Supertest 7 para integración HTTP.
  Style: tsc strict=false con noImplicitAny + strictNullChecks; sin linter ni formatter configurados.

strict_tdd: true

testing:
  strict_tdd: true
  detected: 2026-05-25
  runner:
    framework: vitest
    command: "npm run test:run"   # vitest run (no-watch)
  layers:
    unit: { available: true, tool: vitest }
    integration: { available: true, tool: supertest }
    e2e: { available: false, tool: null }
  coverage:
    available: false
    command: null                 # no @vitest/coverage instalado
  quality:
    linter: { available: false, command: null }
    type_checker: { available: true, command: "npm run typecheck" }  # tsc --noEmit
    formatter: { available: false, command: null }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules under src/modules and src/shared
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow the existing module pattern (route + controller + schemas + utils)
    - Validate all input with Zod schemas; never trust req bodies directly
    tdd: true                     # RED-GREEN-REFACTOR
    test_command: "npm run test:run"
  verify:
    test_command: "npm run test:run"
    build_command: "npm run typecheck"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)
